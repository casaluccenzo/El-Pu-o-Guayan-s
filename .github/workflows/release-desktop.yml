name: Release escritorio

# Compila el instalador de Windows de El Puño Guayanés y lo publica como
# GitHub Release de este repo (de donde se actualizan las PCs instaladas).
# Se corre a mano desde Actions -> "Release escritorio" -> Run workflow.
# Publica la versión que diga package.json: para sacar una nueva, subir
# primero la versión (npm version patch) y pushear a main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      BRAND: el-puno-guayanes
      # El .exe lleva una copia congelada de www/, así que necesita la misma
      # configuración que el proyecto de El Puño en Vercel. Las URLs no son
      # secretas (se sirven al navegador); la anon key va como secret del repo.
      SUPABASE_URL: https://mnnacidnyjrvdbocbdlc.supabase.co
      POWERSYNC_URL: https://6ab84619a77ca1231d2b7ecd.powersync.journeyapps.com
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Sin la key, build.js deja el placeholder y la app cae al Supabase de
      # Casa Lucenzo: mejor no publicar nada.
      - name: Verificar configuración
        shell: bash
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta el secret SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - name: Compilar y publicar
        run: npm run publish
        working-directory: desktop
